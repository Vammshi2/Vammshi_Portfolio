version: 2.1
executors:
  docker-executor:
    docker:
      - image: cimg/python:3.9
    working_directory: ~/project
jobs:
  build-and-test:
    executor: docker-executor
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install fastapi uvicorn transformers torch
      - run:
          name: Run Tests
          command: |
            . venv/bin/activate
            pytest
  dockerize:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker Image
          command: docker build -t fastapi-whisper .
      - run:
          name: Run Docker Compose
          command: docker-compose up -d
workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build-and-test
      - dockerize:
          requires:
            - build-and-test